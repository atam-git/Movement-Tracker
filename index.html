<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journey Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0e14; --surface: #111822; --surface2: #1a2333;
    --border: #1e2d42; --accent: #00d4aa; --accent2: #ff6b35;
    --text: #e8edf5; --muted: #5a7a9a;
  }
  body { font-family: 'Space Grotesk', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

  header { padding: 16px 20px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .logo-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  .logo-dot.recording { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 6px var(--accent); transform: scale(1); } 50% { box-shadow: 0 0 20px var(--accent); transform: scale(1.3); } }
  h1 { font-family: 'Space Mono', monospace; font-size: 15px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  .status-badge { font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); color: var(--muted); background: var(--bg); transition: all 0.3s; }
  .status-badge.active { color: var(--accent); border-color: var(--accent); background: #00d4aa11; }

  #mapContainer { flex: 1; min-height: 280px; position: relative; background: #0d1825; overflow: hidden; }
  #mapCanvas { width: 100%; height: 100%; display: block; }
  .map-placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-size: 13px; pointer-events: none; }
  .map-placeholder .big-icon { font-size: 36px; opacity: 0.4; }

  .bottom-panel { background: var(--surface); border-top: 1px solid var(--border); padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; text-align: center; }
  .stat-value { font-family: 'Space Mono', monospace; font-size: 18px; font-weight: 700; color: var(--accent); line-height: 1; margin-bottom: 4px; }
  .stat-label { font-size: 10px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .controls-row { display: flex; gap: 10px; }
  .btn { flex: 1; padding: 13px 16px; border: none; border-radius: 10px; font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; letter-spacing: 0.02em; }
  .btn-primary { background: var(--accent); color: #0a0e14; }
  .btn-primary:active { opacity: 0.85; }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: transparent; color: var(--accent2); border: 1px solid var(--accent2); }
  .waypoint-section { display: flex; gap: 8px; }
  .waypoint-input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; color: var(--text); font-family: 'Space Grotesk', sans-serif; font-size: 13px; outline: none; transition: border-color 0.2s; }
  .waypoint-input::placeholder { color: var(--muted); }
  .waypoint-input:focus { border-color: var(--accent); }
  .section-label { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; }
  .log-section { max-height: 150px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .log-section::-webkit-scrollbar { width: 4px; }
  .log-section::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .log-entry { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; background: var(--surface2); border-radius: 8px; border-left: 3px solid var(--border); animation: slideIn 0.3s ease; }
  .log-entry.waypoint { border-left-color: var(--accent2); }
  .log-entry.location { border-left-color: var(--accent); }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
  .log-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
  .log-text { font-size: 12px; color: var(--text); line-height: 1.4; }
  .log-time { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); margin-top: 2px; }
  .empty-log { text-align: center; color: var(--muted); font-size: 12px; padding: 20px; font-style: italic; }
  .coords-bar { display: flex; align-items: center; padding: 8px 12px; background: var(--surface2); border-radius: 8px; border: 1px solid var(--border); }
  .coords-text { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted); flex: 1; }
  .coords-text span { color: var(--accent); }
  .modal-overlay { display: none; position: fixed; inset: 0; background: #0a0e14cc; z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; max-width: 320px; width: 100%; text-align: center; }
  .modal h2 { font-family: 'Space Mono', monospace; font-size: 16px; margin-bottom: 10px; color: var(--accent); }
  .modal p { font-size: 13px; color: var(--muted); margin-bottom: 20px; line-height: 1.6; }

  /* Path dot on canvas map */
  .map-dot { position: absolute; width: 12px; height: 12px; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo-dot" id="logoDot"></div>
    <h1>Journey Tracker</h1>
  </div>
  <div class="status-badge" id="statusBadge">IDLE</div>
</header>

<div id="mapContainer">
  <canvas id="mapCanvas"></canvas>
  <div class="map-placeholder" id="mapPlaceholder">
    <div class="big-icon">🗺️</div>
    <div>Your route will appear here</div>
  </div>
</div>

<div class="bottom-panel">
  <div class="coords-bar">
    <div class="coords-text" id="coordsText">📡 Waiting for GPS signal...</div>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-value" id="distStat">0.0</div>
      <div class="stat-label">km travelled</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="pointsStat">0</div>
      <div class="stat-label">checkpoints</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="speedStat">—</div>
      <div class="stat-label">km/h</div>
    </div>
  </div>

  <div class="controls-row">
    <button class="btn btn-primary" id="trackBtn" onclick="toggleTracking()">▶ Start Tracking</button>
    <button class="btn btn-secondary" onclick="confirmClear()">✕ Clear</button>
  </div>

  <div>
    <div class="section-label">Drop a waypoint note</div>
    <div class="waypoint-section">
      <input class="waypoint-input" id="waypointInput" type="text" placeholder="e.g. Stopped for suya in Kaduna 🍢" maxlength="100"/>
      <button class="btn btn-secondary" style="flex:0;padding:12px 16px;" onclick="addWaypoint()">📍</button>
    </div>
  </div>

  <div>
    <div class="section-label">Travel log</div>
    <div class="log-section" id="logSection">
      <div class="empty-log">Your journey log will appear here once you start tracking.</div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="clearModal">
  <div class="modal">
    <h2>Clear Journey?</h2>
    <p>This will erase your entire route and log. This cannot be undone.</p>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-secondary" style="flex:1" onclick="closeClearModal()">Cancel</button>
      <button class="btn btn-danger" style="flex:1" onclick="clearAll()">Clear it</button>
    </div>
  </div>
</div>

<script>
  var tracking = false;
  var watchId = null;
  var positions = [];
  var waypoints = [];
  var totalDistance = 0;
  var lastSpeed = null;

  var canvas = document.getElementById('mapCanvas');
  var ctx = canvas.getContext('2d');

  function resizeCanvas() {
    var container = document.getElementById('mapContainer');
    canvas.width = container.offsetWidth;
    canvas.height = container.offsetHeight;
    drawMap();
  }

  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function calcDist(lat1, lon1, lat2, lon2) {
    var R = 6371;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLon = (lon2 - lon1) * Math.PI / 180;
    var a = Math.sin(dLat/2)*Math.sin(dLat/2) +
            Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
            Math.sin(dLon/2)*Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function latLonToXY(lat, lon, bounds, w, h) {
    var x = (lon - bounds.minLon) / (bounds.maxLon - bounds.minLon) * w;
    var y = h - (lat - bounds.minLat) / (bounds.maxLat - bounds.minLat) * h;
    return { x: x, y: y };
  }

  function getBounds(pts) {
    var lats = pts.map(function(p){ return p[0]; });
    var lons = pts.map(function(p){ return p[1]; });
    var pad = 0.05;
    return {
      minLat: Math.min.apply(null, lats) - pad,
      maxLat: Math.max.apply(null, lats) + pad,
      minLon: Math.min.apply(null, lons) - pad,
      maxLon: Math.max.apply(null, lons) + pad
    };
  }

  function drawMap() {
    var w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    // Background
    ctx.fillStyle = '#0d1825';
    ctx.fillRect(0, 0, w, h);

    if (positions.length === 0) return;

    document.getElementById('mapPlaceholder').style.display = 'none';

    var bounds = getBounds(positions);

    // Draw grid lines
    ctx.strokeStyle = '#1e2d4255';
    ctx.lineWidth = 1;
    for (var i = 0; i <= 4; i++) {
      var gx = (w / 4) * i;
      var gy = (h / 4) * i;
      ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, h); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(w, gy); ctx.stroke();
    }

    // Draw path
    if (positions.length > 1) {
      ctx.beginPath();
      ctx.strokeStyle = '#00d4aa';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      var first = latLonToXY(positions[0][0], positions[0][1], bounds, w, h);
      ctx.moveTo(first.x, first.y);
      for (var i = 1; i < positions.length; i++) {
        var pt = latLonToXY(positions[i][0], positions[i][1], bounds, w, h);
        ctx.lineTo(pt.x, pt.y);
      }
      ctx.stroke();

      // Glow effect
      ctx.beginPath();
      ctx.strokeStyle = '#00d4aa33';
      ctx.lineWidth = 8;
      var fp = latLonToXY(positions[0][0], positions[0][1], bounds, w, h);
      ctx.moveTo(fp.x, fp.y);
      for (var i = 1; i < positions.length; i++) {
        var pt = latLonToXY(positions[i][0], positions[i][1], bounds, w, h);
        ctx.lineTo(pt.x, pt.y);
      }
      ctx.stroke();
    }

    // Start dot
    var sp = latLonToXY(positions[0][0], positions[0][1], bounds, w, h);
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, 6, 0, Math.PI*2);
    ctx.fillStyle = '#ff6b35';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Waypoint dots
    for (var i = 0; i < waypoints.length; i++) {
      var wp = waypoints[i];
      var wpt = latLonToXY(wp.lat, wp.lon, bounds, w, h);
      ctx.beginPath();
      ctx.arc(wpt.x, wpt.y, 5, 0, Math.PI*2);
      ctx.fillStyle = '#ffd166';
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // Current position dot (last point) with pulse ring
    var last = positions[positions.length - 1];
    var cp = latLonToXY(last[0], last[1], bounds, w, h);
    ctx.beginPath();
    ctx.arc(cp.x, cp.y, 14, 0, Math.PI*2);
    ctx.fillStyle = '#00d4aa22';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cp.x, cp.y, 7, 0, Math.PI*2);
    ctx.fillStyle = '#00d4aa';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // Coord labels
    ctx.fillStyle = '#5a7a9a';
    ctx.font = '10px Space Mono, monospace';
    ctx.fillText(last[0].toFixed(4) + ', ' + last[1].toFixed(4), 10, h - 10);
  }

  function formatTime(d) {
    return d.toLocaleTimeString('en-NG', { hour: '2-digit', minute: '2-digit', hour12: true });
  }

  function addLog(text, type, icon) {
    var section = document.getElementById('logSection');
    if (section.querySelector('.empty-log')) section.innerHTML = '';
    var el = document.createElement('div');
    el.className = 'log-entry ' + type;
    el.innerHTML =
      '<div class="log-icon">' + icon + '</div>' +
      '<div class="log-content">' +
        '<div class="log-text">' + text + '</div>' +
        '<div class="log-time">' + formatTime(new Date()) + '</div>' +
      '</div>';
    section.insertBefore(el, section.firstChild);
  }

  function updateStats() {
    document.getElementById('distStat').textContent = totalDistance.toFixed(1);
    document.getElementById('pointsStat').textContent = positions.length;
    document.getElementById('speedStat').textContent = lastSpeed !== null ? Math.round(lastSpeed) : '—';
  }

  function onPosition(pos) {
    var lat = pos.coords.latitude;
    var lon = pos.coords.longitude;
    var speed = pos.coords.speed;
    lastSpeed = speed ? speed * 3.6 : null;

    document.getElementById('coordsText').innerHTML =
      '<span>' + lat.toFixed(5) + '</span>, <span>' + lon.toFixed(5) + '</span>';

    if (positions.length > 0) {
      var prev = positions[positions.length - 1];
      var d = calcDist(prev[0], prev[1], lat, lon);
      if (d > 0.005) {
        totalDistance += d;
        positions.push([lat, lon]);
      }
    } else {
      positions.push([lat, lon]);
      addLog('Journey started — ' + lat.toFixed(4) + ', ' + lon.toFixed(4), 'location', '🚌');
    }

    drawMap();
    updateStats();
  }

  function onError(err) {
    var msgs = { 1: 'Location permission denied.', 2: 'GPS signal unavailable.', 3: 'GPS timed out, retrying...' };
    document.getElementById('coordsText').textContent = '⚠️ ' + (msgs[err.code] || 'GPS error');
  }

  function toggleTracking() {
    if (!tracking) {
      if (!navigator.geolocation) { alert('Geolocation not supported on this device.'); return; }
      tracking = true;
      document.getElementById('trackBtn').textContent = '⏸ Pause';
      document.getElementById('trackBtn').style.background = '#ff6b35';
      document.getElementById('statusBadge').textContent = 'TRACKING';
      document.getElementById('statusBadge').classList.add('active');
      document.getElementById('logoDot').classList.add('recording');
      watchId = navigator.geolocation.watchPosition(onPosition, onError, {
        enableHighAccuracy: true, timeout: 15000, maximumAge: 5000
      });
    } else {
      tracking = false;
      document.getElementById('trackBtn').textContent = '▶ Resume';
      document.getElementById('trackBtn').style.background = '';
      document.getElementById('statusBadge').textContent = 'PAUSED';
      document.getElementById('statusBadge').classList.remove('active');
      document.getElementById('logoDot').classList.remove('recording');
      if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
      addLog('Tracking paused', 'location', '⏸');
    }
  }

  function addWaypoint() {
    var input = document.getElementById('waypointInput');
    var note = input.value.trim();
    if (!note) return;
    if (positions.length === 0) { alert('Start tracking first to pin a waypoint.'); return; }
    var last = positions[positions.length - 1];
    waypoints.push({ lat: last[0], lon: last[1], note: note });
    addLog(note, 'waypoint', '📌');
    input.value = '';
    drawMap();
  }

  document.getElementById('waypointInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') addWaypoint();
  });

  function confirmClear() { document.getElementById('clearModal').classList.add('show'); }
  function closeClearModal() { document.getElementById('clearModal').classList.remove('show'); }

  function clearAll() {
    if (tracking) toggleTracking();
    positions = []; waypoints = []; totalDistance = 0; lastSpeed = null;
    document.getElementById('logSection').innerHTML = '<div class="empty-log">Your journey log will appear here once you start tracking.</div>';
    document.getElementById('coordsText').textContent = '📡 Waiting for GPS signal...';
    document.getElementById('trackBtn').textContent = '▶ Start Tracking';
    document.getElementById('trackBtn').style.background = '';
    document.getElementById('statusBadge').textContent = 'IDLE';
    document.getElementById('statusBadge').classList.remove('active');
    document.getElementById('logoDot').classList.remove('recording');
    document.getElementById('mapPlaceholder').style.display = 'flex';
    updateStats();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#0d1825';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    closeClearModal();
  }
</script>
</body>
</html>
